# Date the synthetic samples are given. Alpha and Delta were circulating at
# roughly equal frequency in the UK on this day.
sample_date: "2021-05-16"
country: "United Kingdom"

# Paths, relative to simulations/synthetic_recombinants/
viridian_dataset: "../../data/viridian_mafft_2024-10-14_v1.vcz.zip"
# Raw inference ARG for the day before sample_date, so the synthetic samples
# are matched as new arrivals.
arg: "../../data/v2_2026-09-22_2021-05-15.ts.tsz"
# Used only to filter the sample pool down to samples that the published
# inference accepted.
reference_arg: "../../data/sc2ts_viridian_v2.2.trees.tsz"
# Pinned pango-designation data, shared with the postprocessing pipeline.
pangonet_data: "../../arg_postprocessing/pangonet_data"

# Parent lineage pairs. Alpha x Alpha parents are far closer than Alpha x Delta,
# so the two bracket the range of parent divergence seen in the real ARG.
crosses: "Alpha:Delta,Alpha:Alpha"

# Per cross. A full run uses 500.
num_recombinants: 25
# -1 for the whole control pool (338). A full run uses -1.
num_controls: 25

seed: 42

# Mutations added to each parent (and control) before splicing, to model
# parents that were not themselves sampled. A multiplier of 1 is the number
# expected in one transmission generation, as if every case were sequenced; 5
# is as if one in five were, and 10 one in ten. 0 leaves the sequences as they
# are.
mutation_multipliers:
  - 0
  - 1
  - 5
  - 10
# Substitutions per site per year, about 24 per genome per year.
mutation_rate: 0.0008
# Mean transmission generation time, in days.
generation_time: 5.5

k_values:
  - 3
  - 4
  - 5

num_threads: 4
