# A small configuration for checking the whole pipeline runs, e.g.
#   snakemake --cores 4 results/tiny/summary.csv --configfile tests/tiny_config.yaml
pathogens:
  tiny:
    N: 20
    GENS: 15
    GROWTH_GENS: 5
    L: 1000
    MU: 2.0e-3
    EFF_RECOMB: 0.2
replicates: 1
seed: 1
p_values: [0.5, 1.0]
k_values: [3]
num_threads: 2
sc2ts:
  hmm_cost_threshold: 7
  max_missing_sites: 500
  deletions_as_missing: true
  min_group_size: 10
  min_root_mutations: 2
  max_recurrent_mutations: 2
  max_mutations_per_sample: 5
  retrospective_window: 7
  max_pango_lineages: 3
  memory_limit: 4
