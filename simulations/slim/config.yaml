# Named SLiM parameter sets, one per pathogen. See santasim_like.slim for the
# meaning of each parameter.
pathogens:
  default:
    N: 100
    GENS: 100
    GROWTH_GENS: 20
    L: 10000
    MU: 1.0e-3
    EFF_RECOMB: 0.01
  sars_like:
    # SARS-CoV-like
    # https://pmc.ncbi.nlm.nih.gov/articles/PMC9297283/#CR30
    N: 10000
    GENS: 730 # 2 years
    GROWTH_GENS: 180  # 6 months
    L: 30000  # SARS-CoV-1/2
    MU: 1.37e-6 # 5e-4 (/site/year) / 365 days
    EFF_RECOMB: 1.64e-4 # 2e-6 (/site/year) x L / 365 days
  flu_like:
    # pdm2009-like H1N1
    # https://www.pnas.org/doi/10.1073/pnas.1918304117#supplementary-materials
    N: 10000
    GENS: 730 # 2 years
    GROWTH_GENS: 180  # 6 months
    L: 13000  # pdm2009 H1N1
    MU: 7.53e-6 # 2.75e-3 (/site/year) / 365 days
    EFF_RECOMB: 6.85e-4 # 0.25 (/lineage/year) / 365 days

# Independent SLiM runs per pathogen. Replicate r uses SLiM seed seed + r.
replicates: 1
seed: 42

# Sampling probabilities across all generations; the founder is always sampled.
# The same draws are used for each P, so samples are nested as P increases.
P: [0.1, 0.5, 1.0]

# sc2ts num_mismatches values.
k_values: [3, 4, 5]

# Maximum threads per sc2ts inference job.
num_threads: 8

# Other sc2ts extend parameters.
sc2ts:
  hmm_cost_threshold: 7
  max_missing_sites: 500
  deletions_as_missing: true
  min_group_size: 10
  min_root_mutations: 2
  max_recurrent_mutations: 2
  max_mutations_per_sample: 5
  retrospective_window: 7
  max_pango_lineages: 3
  memory_limit: 4
