# The pathogens studied. Each has a set of SLiM parameters (see
# santasim_like.slim for their meaning) and the numbers of individuals sampled
# from each generation (day). Samples are a uniform random subset of each
# generation (all of it, if smaller), nested as the number increases, and the
# founder is always sampled.
pathogens:
  coronavirus_like:
    # A generic coronavirus: ~30 kb genome, 0.0008 substitutions/site/year
    # and a 5.5 day generation time (as in synthetic_recombinants), so
    # ~0.36 mutations per genome per generation. 0.5% of transmissions are
    # recombinant: several times higher than estimated for SARS-CoV-2, to
    # give enough recombination events to measure.
    slim:
      N: 1000
      GENS: 200
      GROWTH_GENS: 20
      L: 30000
      MU: 1.2e-5
      EFF_RECOMB: 0.005
    samples_per_day: [20, 100]
  flu_like:
    # pdm2009-like H1N1
    # https://www.pnas.org/doi/10.1073/pnas.1918304117#supplementary-materials
    slim:
      N: 1000000
      GENS: 100  # days
      GROWTH_GENS: 50  # days
      L: 13000  # pdm2009 H1N1
      MU: 7.53e-6 # 2.75e-3 (/site/year) / 365 days
      EFF_RECOMB: 6.85e-4 # 0.25 (/lineage/year) / 365 days
    samples_per_day: [200, 1000]

# Independent SLiM runs per pathogen. Replicate r uses SLiM seed seed + r.
replicates: 5
seed: 42

# sc2ts num_mismatches values.
k_values: [3, 4, 5]

# Maximum threads per sc2ts inference job.
num_threads: 8

# Other sc2ts extend parameters (see README.md).
sc2ts:
  # No time-traveller filtering. On real data, samples whose HMM cost is above
  # hmm_cost_threshold are held back, and only added later if enough of them
  # form a plausible retrospective group, to keep out samples with wrong dates
  # ("time travellers") and sequencing errors. Simulated samples have neither,
  # so the threshold is set high enough that every sample is added on its own
  # day. It can't just be left out: sc2ts then defaults it to 5. With nothing
  # held back, the retrospective group parameters (min_group_size,
  # retrospective_window, etc.) are never used, so are left at their defaults.
  hmm_cost_threshold: 1000000
  max_missing_sites: 500
  deletions_as_missing: true
  memory_limit: 4
